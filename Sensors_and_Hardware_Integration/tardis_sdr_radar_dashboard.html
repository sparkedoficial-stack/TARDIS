<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDR Radar - TARDIS Hub</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --border-color: #30363d;
            --success-color: #3fb950;
            --danger-color: #f85149;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            margin: 0;
            padding: 20px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            color: #fff;
        }

        .status-badge {
            background-color: var(--success-color);
            color: #fff;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: flex-end;
            margin-bottom: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .control-group label {
            font-size: 14px;
            font-weight: bold;
        }

        .control-group input {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 4px;
            width: 80px;
        }

        button {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.8;
        }

        button:disabled {
            background-color: var(--border-color);
            cursor: not-allowed;
        }

        .radar-view {
            width: 100%;
            height: 300px;
            background-color: #000;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
        }

        .bar {
            flex: 1;
            background-color: var(--accent-color);
            margin: 0 1px;
            transition: height 0.2s ease;
            position: relative;
        }

        .bar.detected {
            background-color: var(--danger-color);
        }

        .bar-label {
            position: absolute;
            bottom: -20px;
            font-size: 10px;
            color: #8b949e;
            transform: translateX(-50%);
            left: 50%;
        }

        .log-panel {
            font-family: monospace;
            background-color: #000;
            padding: 10px;
            height: 150px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }

        .log-entry {
            margin: 0 0 5px 0;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📻 TARDIS SDR Radar</h1>
        <div class="status-badge" id="status-badge">Conectado</div>
    </div>

    <div class="panel">
        <div class="controls">
            <div class="control-group">
                <label>Frec. Inicial (MHz)</label>
                <input type="number" id="start-freq" value="88.0" step="0.1">
            </div>
            <div class="control-group">
                <label>Frec. Final (MHz)</label>
                <input type="number" id="stop-freq" value="108.0" step="0.1">
            </div>
            <div class="control-group">
                <label>Salto (MHz)</label>
                <input type="number" id="step-freq" value="2.0" step="0.1">
            </div>
            <button id="btn-sweep" onclick="runSweep()">Ejecutar Barrido</button>
        </div>

        <div class="radar-view" id="radar-view">
            <!-- Barras generadas por JS -->
        </div>
    </div>

    <div class="panel">
        <h3>Registro de Telemetría</h3>
        <div class="log-panel" id="log-panel">
            <p class="log-entry">Esperando inicialización...</p>
        </div>
    </div>

    <script>
        function log(msg) {
            const panel = document.getElementById('log-panel');
            const entry = document.createElement('p');
            entry.className = 'log-entry';
            const now = new Date().toISOString().split('T')[1].slice(0, -1);
            entry.innerText = `[${now}] ${msg}`;
            panel.appendChild(entry);
            panel.scrollTop = panel.scrollHeight;
        }

        async function runSweep() {
            const btn = document.getElementById('btn-sweep');
            const start = document.getElementById('start-freq').value;
            const stop = document.getElementById('stop-freq').value;
            const step = document.getElementById('step-freq').value;

            btn.disabled = true;
            log(`Iniciando barrido espectral: ${start}MHz - ${stop}MHz...`);

            try {
                const response = await fetch(`/api/sdr_radar/sweep?start=${start}&stop=${stop}&step=${step}`);
                const data = await response.json();

                if (data.status === 'success') {
                    renderRadar(data.sweep_results);
                    log(`Barrido completado. ${data.sweep_results.length} muestras obtenidas.`);
                } else {
                    log(`Error en el barrido: ${data.message}`);
                }
            } catch (error) {
                log(`Error de red: ${error.message}`);
            }

            btn.disabled = false;
        }

        function renderRadar(results) {
            const view = document.getElementById('radar-view');
            view.innerHTML = ''; // Limpiar

            const minStrength = -120;
            const maxStrength = -30;

            results.forEach(res => {
                const bar = document.createElement('div');
                bar.className = 'bar';
                if (res.detected) {
                    bar.classList.add('detected');
                    log(`>> Señal detectada en ${res.frequency_mhz} MHz (${res.strength_dbm} dBm)`);
                }

                // Normalizar altura: -120 = 0%, -30 = 100%
                const heightPercent = Math.max(0, Math.min(100, ((res.strength_dbm - minStrength) / (maxStrength - minStrength)) * 100));
                bar.style.height = `${heightPercent}%`;
                bar.title = `${res.frequency_mhz} MHz: ${res.strength_dbm} dBm`;

                // Etiqueta de frecuencia
                const label = document.createElement('div');
                label.className = 'bar-label';
                label.innerText = res.frequency_mhz;
                bar.appendChild(label);

                view.appendChild(bar);
            });
        }

        // Check status on load
        fetch('/api/sdr_radar/status')
            .then(r => r.json())
            .then(d => {
                log(`SDR conectado: ${d.connected}`);
            }).catch(e => {
                log(`Error verificando estado: ${e}`);
            });
    </script>
</body>
</html>
